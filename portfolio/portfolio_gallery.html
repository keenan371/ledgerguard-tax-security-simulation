nt gap", "Scores are planning heuristics, not compliance ratings"], ["04", "First 30 Days", "Four finite control outcomes", "MFA enrollment · separate admin workflow", "Encryption/patch posture · restore validation", "Each outcome has owner and evidence rule"], ["05", "Verification Matrix", "8 control checks", "Every control has requested evidence and pass rule", "Baseline results are intentionally not passed", "No live verification was performed"], ["06", "Scope Guardrails", "What this engagement does not do", "No pentesting · forensics · 24/7 monitoring", "No migrations · managed IT · legal advice", "No certification or security guarantee"], ["07", "Delivery MVC", "Fixed-scope delivery flow", "Qualify → Scope → Client-led collection → Analyze", "Readout → Handoff → One clarification round", "Internal $4,500 hypothesis requires validation"], ["08", "Readiness Gate", "Cold-call readiness: NO PASS", "Assets and safety boundaries are complete", "Market validation, proposal review, and counsel review are pending", "Do not quote price as validated or imply live assessment"]];const p=new URLSearchParams(location.search);const i=Math.max(0,Math.min(s.length-1,(+p.get('slide')||1)-1));const x=s[i];document.title='LedgerGuard Portfolio '+x[0];document.querySelector('#title').textContent=x[1];document.querySelector('#firm').textContent=x[2];document.querySelector('#grid').innerHTML=x.slice(3).map(v=>`<div class='card'>${v}</div>`).join('');</script></body></html>
